name: Publish roadmap (manual)
on:
  workflow_dispatch:
    inputs:
      public_review:
        description: 'Type PUBLISH after reviewing the four public roadmap files'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: roadmap-pages
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && inputs.public_review == 'PUBLISH'
    uses: ./.github/workflows/roadmap-ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python tools/check_roadmap.py --output _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMARTINI’s Text</title><script src="/meeting-ui/text/text_markdown.js"></script>
<style>body{font:15px system-ui;color:#173c2c;background:#f4f8f5;padding:16px;margin:0}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #b6c9bc;border-radius:8px;background:white}textarea{font-family:ui-monospace,monospace;min-height:220px}button,a.button{font:inherit;background:#216346;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.6}.row{display:flex;gap:12px}.row>div{flex:1}.hint{font-size:13px;color:#526c5c}#error{color:#982a2a}#preview{background:white;padding:14px;border-radius:8px;overflow-wrap:anywhere}pre{overflow:auto}table{border-collapse:collapse}th,td{padding:5px;border:1px solid #ccc}[hidden]{display:none!important}@media(max-width:450px){.row{display:block}}</style></head><body>
<h2>SMARTINI’s Text</h2><p>Add your own text. No AI processing or rewriting.</p>
<form id="form"><div class="row"><div><label for="title">Title</label><input id="title" required maxlength="150"></div><div><label for="date">Date</label><input id="date" type="date" required></div></div>
<label for="markdown">Text · Markdown supported</label><textarea id="markdown" required maxlength="120000" placeholder="# Your recap&#10;&#10;Add your text here…"></textarea>
<p class="hint">Up to 120,000 characters. Saving creates a draft; approval happens separately in the shared dashboard.</p><details><summary>Markdown preview</summary><div id="preview"></div></details><p><button id="save" type="submit">Save draft &amp; open review</button></p></form>
<p id="state" role="status">Waiting for your text.</p><p id="error" role="alert"></p><a id="review" class="button" target="_blank" rel="noopener noreferrer" hidden>Open text review</a>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),token='__TOKEN__',base='/meeting-ui/write/';let saved=false,busy=false;
const today=new Date();$('date').value=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
function resize(){parent.postMessage({type:'iframe:height',height:document.documentElement.scrollHeight},'*');}
async function call(action,obj){const r=await fetch(base+action+'/'+token,{method:obj===undefined?'GET':'POST',credentials:'omit',headers:obj===undefined?{}:{'Content-Type':'application/json'},body:obj===undefined?undefined:JSON.stringify(obj)});const value=await r.json();if(!r.ok)throw Error(value.error||'Text request failed');return value;}
function show(value){if(!value.doc_id)return;saved=true;for(const node of $('form').querySelectorAll('input,textarea,button'))node.disabled=true;$('state').textContent='Draft saved. Review it in the dashboard, then approve it for Knowledge.';const url=new URL(value.dashboard_path,location.href);if(url.origin===location.origin){$('review').href=url.href;$('review').hidden=false;}resize();}
$('markdown').oninput=()=>{smartinisTextMarkdown($('preview'),$('markdown').value);resize();};document.querySelector('details').ontoggle=resize;
$('form').onsubmit=async event=>{event.preventDefault();if(saved||busy)return;busy=true;$('save').disabled=true;$('error').textContent='';try{const existing=await call('status');if(existing.doc_id){show(existing);return;}const payload={title:$('title').value,date:$('date').value,markdown:$('markdown').value};show(await call('submit',{confirmed:true,payload}));}catch(error){$('error').textContent=error.message;$('save').disabled=false;}finally{busy=false;resize();}};
async function poll(){try{show(await call('status'));}catch(error){$('error').textContent=error.message;resize();}}poll();setInterval(()=>{if(!saved)poll();},4000);resize();
})();
</script></body></html>
